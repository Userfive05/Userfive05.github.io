# AirQSensor — ESPHome configuration
# Add the referenced values to your private secrets.yaml before compiling.
esphome:
  name: airqsensor
  friendly_name: AirQSensor

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Airqsensor Fallback Hotspot"
    # Original fallback password; ESPHome may reject it because it is under 8 characters.
    password: "changeme"

captive_portal:

i2c:
  sda: GPIO5
  scl: GPIO6
  scan: true

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

font:
  - file: "gfonts://Inter@700"
    id: myFont
    size: 22
  - file: "gfonts://Inter@700"
    id: font_big
    size: 30
  - file: "gfonts://Inter@700"
    id: font_label
    size: 18

sensor:
  - platform: sen6x
    id: sen66
    update_interval: 10s
    co2:
      id: sen66_co2
      name: "CO2"
    pm_1_0:
      id: sen66_pm1
      name: "PM 1.0"
    pm_2_5:
      id: sen66_pm25
      name: "PM 2.5"
    pm_4_0:
      id: sen66_pm4
      name: "PM 4.0"
    pm_10_0:
      id: sen66_pm10
      name: "PM 10"
    voc_index:
      id: sen66_voc
      name: "VOC Index"
    nox_index:
      id: sen66_nox
      name: "NOx Index"
    temperature:
      id: raw_temp
      internal: true
    humidity:
      id: raw_hum
      internal: true

  # Match the sensor interval so corrected values refresh every 10 seconds.
  - platform: template
    name: "Temperature"
    id: sen66_temp
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 10s
    lambda: "return id(raw_temp).state + id(offset_temp).state;"

  - platform: template
    name: "Humidity"
    id: sen66_hum
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    update_interval: 10s
    lambda: |-
      float t_r = id(raw_temp).state;
      float t_c = t_r + id(offset_temp).state;
      float rh = id(raw_hum).state * exp(17.62 * ((t_r / (243.12 + t_r)) - (t_c / (243.12 + t_c))));
      return clamp(rh + id(offset_hum).state, 0.0f, 100.0f);

# Adjustable from Home Assistant; values persist across restarts.
number:
  - platform: template
    name: "Calibration Temperature"
    id: offset_temp
    min_value: -5
    max_value: 5
    step: 0.1
    initial_value: 0
    optimistic: true
    restore_value: true

  - platform: template
    name: "Calibration Humidity"
    id: offset_hum
    min_value: -10
    max_value: 10
    step: 0.1
    initial_value: 0
    optimistic: true
    restore_value: true

  - platform: template
    name: "CO2 Alert Threshold"
    id: co2_alert
    unit_of_measurement: "ppm"
    min_value: 600
    max_value: 2000
    step: 50
    initial_value: 1000
    optimistic: true
    restore_value: true

  - platform: template
    name: "VOC Alert Threshold"
    id: voc_alert
    min_value: 50
    max_value: 400
    step: 10
    initial_value: 150
    optimistic: true
    restore_value: true

  - platform: template
    name: "PM2.5 Alert Threshold"
    id: pm25_alert
    unit_of_measurement: "µg/m³"
    min_value: 5
    max_value: 150
    step: 5
    initial_value: 35
    optimistic: true
    restore_value: true

# Landscape display layout, approximately 250 x 122 pixels.
display:
  - platform: waveshare_epaper
    id: epaper_display
    model: 2.13inv3
    cs_pin: GPIO44
    dc_pin: GPIO10
    busy_pin: GPIO4
    reset_pin: GPIO38
    rotation: 270
    update_interval: 30s
    # Refresh count, not seconds. 3600 x 30 seconds = 30 hours.
    full_update_every: 3600
    lambda: |-
      // Icons drawn directly, without external image assets.
      auto icon_co2 = [&](int x, int y, Color c) {
        it.filled_circle(x + 6, y + 10, 6, c);
        it.filled_circle(x + 13, y + 6, 7, c);
        it.filled_circle(x + 20, y + 10, 6, c);
        it.filled_rectangle(x + 3, y + 10, 20, 7, c);
      };

      auto icon_thermometer = [&](int x, int y) {
        it.rectangle(x + 5, y, 4, 10);
        it.filled_circle(x + 7, y + 12, 4);
        it.filled_rectangle(x + 6, y + 4, 2, 6);
      };

      auto draw_triangle_up = [&](int cx, int apex_y, int height, int base_half_width) {
        for (int row = 0; row < height; row++) {
          int half = (int) ((float) row / height * base_half_width) + 1;
          it.horizontal_line(cx - half, apex_y + row, half * 2 + 1);
        }
      };

      auto icon_droplet = [&](int x, int y) {
        draw_triangle_up(x + 8, y, 8, 6);
        it.filled_circle(x + 8, y + 9, 6);
      };

      auto icon_particles = [&](int x, int y) {
        it.filled_circle(x + 3, y + 9, 2);
        it.filled_circle(x + 8, y + 3, 3);
        it.filled_circle(x + 13, y + 8, 2);
      };

      auto icon_flask = [&](int x, int y) {
        it.rectangle(x + 6, y, 3, 5);
        it.rectangle(x + 2, y + 5, 11, 9);
        it.filled_rectangle(x + 3, y + 9, 9, 4);
      };

      // Add an outer outline when the configured threshold is reached.
      auto draw_bar = [&](int x, int y, int w, int h, float value, float min_v, float max_v, float bad) {
        float frac = clamp((value - min_v) / (max_v - min_v), 0.0f, 1.0f);
        it.rectangle(x, y, w, h);
        it.filled_rectangle(x, y, (int) (w * frac), h);
        if (value >= bad) {
          it.rectangle(x - 2, y - 2, w + 4, h + 4);
        }
      };

      // CO2 headline: invert the block above the alert threshold.
      bool co2_bad = id(sen66_co2).state >= id(co2_alert).state;
      Color hero = co2_bad ? COLOR_OFF : COLOR_ON;
      if (co2_bad) {
        it.filled_rectangle(0, 0, 250, 42);
      }
      icon_co2(8, 12, hero);
      it.print(40, 10, id(font_label), hero, TextAlign::TOP_LEFT, "CO2");
      it.printf(86, 5, id(font_big), hero, TextAlign::TOP_LEFT, "%.0f ppm", id(sen66_co2).state);
      draw_bar(4, 46, 242, 8, id(sen66_co2).state, 400, 2000, id(co2_alert).state);

      it.horizontal_line(0, 58, 250);
      it.vertical_line(125, 59, 64);

      // Temperature and humidity.
      icon_thermometer(5, 65);
      it.printf(24, 60, id(myFont), "%.1f°C", id(sen66_temp).state);
      icon_droplet(133, 65);
      it.printf(153, 60, id(myFont), "%.0f%%", id(sen66_hum).state);
      it.horizontal_line(0, 86, 250);

      // PM2.5 and VOC.
      icon_particles(3, 93);
      it.printf(20, 88, id(font_label), "PM2.5 %.1f", id(sen66_pm25).state);
      draw_bar(4, 112, 116, 5, id(sen66_pm25).state, 0, 100, id(pm25_alert).state);
      icon_flask(133, 91);
      it.printf(153, 89, id(font_label), "VOC %.0f", id(sen66_voc).state);
      draw_bar(133, 112, 116, 5, id(sen66_voc).state, 0, 500, id(voc_alert).state);

